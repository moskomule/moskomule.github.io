<p class="page__meta">
  {{- if not .Date.IsZero }}<time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format (site.Params.dateFormat | default "2006-01-02") }}</time>{{ end }}
  {{- with .Params.tags }}<span>{{ range $i, $t := . }}{{ if $i }} {{ end }}<a href="{{ printf "/tags/%s/" ($t | urlize) | relLangURL }}">#{{ $t }}</a>{{ end }}</span>{{ end }}
</p>
