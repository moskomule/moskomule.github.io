baseURL                          = "https://hataya.tokyo/"  # Your domain name. Must end with "/"
theme                            = "hataya"
DefaultContentLanguage           = "en"                    # Default language for multilingual sites
hasCJKLanguage                   = true                    # Correct word counts / reading time for Japanese

[params]
    themeStyle                   = "light"                 # Choose "light" or "dark"
    favicon                      = "/img/fav.ico"          # Path to favicon file
    showRSSButton                = false                   # Show rss button in navigation
    fadeIn                       = false                    # Turn on/off the fade-in effect
    fadeInIndex                  = false                  # Turn on/off the fade-in effect on the index page even if fade-in was otherwise turned off
    dateFormat                   = "Jan 2, 2006"
    #email                        = ""   # E-mail address for contact section
    customCSS                    = ["css/custom.css"]             # Include custom css files placed under assets/
    math                         = true                    # Load MathJax on every page
    # cv                         = "/cv.pdf"               # Shows a "CV" button next to "Contact"

    # Profile header (images are looked up in content/<lang>/home/, then assets/, then static/)
    [params.profile]
        avatar                   = "profile.png"
        cover                    = "prague.png"
        coverPosition            = "center 62%"            # CSS object-position of the cover photo

    # Publication list generated from data/publications.bib (see scripts/bib2json.py)
    [params.publications]
        me                       = ["Ryuichiro Hataya", "R. Hataya"]   # shown in bold

    # Configure the home page
    [params.home]
        introHeight              = "medium"            # Input either "medium" or "large" or "fullheight"
        showLatest               = true                    # Show latest blog post summary
        showAllPosts             = false                   # Set true to list all posts on home page, or set false to link to separate blog list page
        numberOfProjectsToShow   = 3                       # Maximum number of projects to show on home page. Unset or comment out to show all projects

        localTime                = false                    # Show your current local time in contact section
        timeZone                 = "Asia/Tokyo"   # Your timezone as in the TZ* column of this list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
        timeFormat               = "h:mm A"                # https://momentjs.com/docs/#/displaying/format/
    [params.projects]
        useTwoColumns            = false                   # Use a layout with two columns instead of three

    # Share buttons on blog post pages
    [params.share]
        twitter                  = true
        facebook                 = true

    # Social icons appear in introduction and contact section. Add as many more as you like.
    # Icon pack "fab" includes social network icons, see: https://fontawesome.com/icons?d=gallery&s=brands&m=free
    # Icon pack "fas" includes solid style icons, see: https://fontawesome.com/icons?d=gallery&s=solid&m=free
    #[[params.social]]
    #    url   = "https://twitter.com/ryuichirohataya"
    #    icon  = "twitter" # icon name without the 'fa-'
    #    icon_pack = "fab"

    [[params.social]]
        url       = "https://github.com/moskomule"
        icon      = "github"
        icon_pack = "fab"

    [[params.social]]
        url       = "https://www.linkedin.com/in/ryuichiro-hataya-7940a1125"
        icon      = "linkedin"
        icon_pack = "fab"

    [[params.social]]
        url       = "https://scholar.google.com/citations?user=84l6KcEAAAAJ"
        icon      = "graduation-cap"
        icon_pack = "fas"
    
[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = false
    hl_Lines = ""
    lineNoStart = 1
    lineNos = false
    lineNumbersInTable = true
    noClasses = true
    style = "monokailight"
    tabWidth = 4
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true


# If you don't want to use the default menu, you can define one by yourself
# [[menu.main]]
#     name    = "Home"
#     url     = "/"
#     weight  = 0
# [[menu.main]]
#     name    = "Blog"
#     url     = "/blog/"
#     weight  = 1

# content/<lang>/home/ only holds the sections of the top page; do not render it as its own page.
[[cascade]]
  [cascade.build]
    render = "never"
    list   = "never"
  [cascade.target]
    path = "{/home,/home/**}"

# We only use tag as a taxonomies
# You can add more by yourself
[taxonomies]
  tag = "tags"

[languages]
    [languages.en]
        languageName     = "English"
        languageCode     = "en-us"
        contentDir       = "content/en"
        weight           = 0
        title            = "Ryuichiro Hataya's webpage"
        [languages.en.params]
            description  = "Ryuichiro Hataya's webpage"   # Max 160 characters show in search results
            footerText   = "2019-2026, by Ryuichiro Hataya, Powered by [hugo](https://gohugo.io)"                      # Text to override default footer text (markdown allowed)
            authorName   = "Ryuichiro Hataya"
            tagline      = "幡谷 龍一郎 · PhD (Information Science and Technology)"
            affiliations = ["Senior Research Scientist, SB Intuitions", "Program-Specific Assistant Professor, Kyoto University", "Tokyo, Japan"]

    [languages.ja]
        languageName     = "日本語"
        languageCode     = "ja"
        contentDir       = "content/ja"
        weight           = 1
        title            = "..."

        # hugo uses spaces to detect length
        summaryLength = 2
        
        [languages.ja.params]
            dateFormat   = "2006年1月2日"
            description  = "..."
            footerText   = "2019-2026, by Ryuichiro Hataya, Powered by [hugo](https://gohugo.io)"                      # Text to override default footer text (markdown allowed)
            authorName   = "幡谷 龍一郎"
            tagline      = "Ryuichiro Hataya · 博士（情報理工学）"
            affiliations = ["SB Intuitions シニアリサーチサイエンティスト", "京都大学 特定助教", "東京"]

