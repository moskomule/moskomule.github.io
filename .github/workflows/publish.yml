name: publish

on:
  push:
    branches: [source]
  pull_request:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write   # push the built site to the master branch

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.167.0"

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip run')"

    steps:
      - uses: actions/checkout@v7

      - name: Convert publications.bib
        run: python3 scripts/bib2json.py   # standard library only; uses the runner's Python

      # Hugo has no official setup action; this is the install step from
      # https://gohugo.io/host-and-deploy/host-on-github-pages/
      - name: Install Hugo
        run: |
          mkdir -p "${HOME}/.local/hugo"
          curl -sSLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          TZ: Asia/Tokyo
        run: |
          hugo version
          hugo build --gc --minify

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: master
          cname: hataya.tokyo
