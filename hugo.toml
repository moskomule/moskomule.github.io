baseURL                = "https://hataya.tokyo/"
theme                  = "hataya"
defaultContentLanguage = "en"
hasCJKLanguage         = true          # count Japanese characters correctly (summaries etc.)

[params]
    dateFormat         = "Jan 2, 2006"
    customCSS          = ["css/custom.css"]   # extra CSS files under assets/
    math               = true                 # load MathJax
    # favicon          = "/favicon.ico"       # file under static/
    # email            = ""                   # shown in the contact section
    # cv               = "/cv.pdf"            # shows a "CV" button next to "Contact"

    # Profile header. Images are looked up in content/<lang>/home/, then assets/, then static/.
    [params.profile]
        avatar         = "profile.png"
        cover          = "prague.png"
        coverPosition  = "center 62%"         # CSS object-position of the cover photo

    # Optional color overrides, exposed to the stylesheet as --style-<key>
    # [params.style]
    #     accent       = "#1d64d8"
    #     accent-ink   = "#134aa3"

    # Publication list generated from publications.bib (see scripts/bib2json.py)
    [params.publications]
        me             = ["Ryuichiro Hataya", "R. Hataya"]   # shown in bold

    [params.home]
        showAllPosts           = false        # true: list every post on the top page (otherwise the latest 3)
        numberOfProjectsToShow = 3            # projects shown on the top page

    # Share links on blog posts
    [params.share]
        twitter        = true                 # X
        bluesky        = false
        facebook       = true

    # Profile links. `name` is optional; it is guessed from `icon` (github, linkedin, graduation-cap, ...).
    [[params.social]]
        url            = "https://github.com/moskomule"
        icon           = "github"

    [[params.social]]
        url            = "https://www.linkedin.com/in/ryuichiro-hataya-7940a1125"
        icon           = "linkedin"

    [[params.social]]
        url            = "https://scholar.google.com/citations?user=84l6KcEAAAAJ"
        icon           = "graduation-cap"

[markup]
  [markup.highlight]
    noClasses          = false                # CSS generated by css.ChromaStyles
    style              = "monokailight"
    tabWidth           = 4
  [markup.goldmark.renderer]
    unsafe             = true                 # allow raw HTML such as <details> in markdown

# The default menu lists the top-page sections. Define your own to override it:
# [[menu.main]]
#     name   = "Blog"
#     url    = "/blog/"
#     weight = 1

# content/<lang>/home/ only holds the sections of the top page; do not render it as its own page.
[[cascade]]
  [cascade.build]
    render = "never"
    list   = "never"
  [cascade.target]
    path = "{/home,/home/**}"

[taxonomies]
  tag = "tags"

[languages]
    [languages.en]
        label          = "English"
        locale         = "en-US"
        contentDir     = "content/en"
        weight         = 0
        title          = "Ryuichiro Hataya's webpage"
        [languages.en.params]
            description  = "Ryuichiro Hataya's webpage"   # max 160 characters, shown in search results
            footerText   = "2019-2026, by Ryuichiro Hataya, Powered by [Hugo](https://gohugo.io)"
            authorName   = "Ryuichiro Hataya"
            tagline      = "幡谷 龍一郎 · PhD (Information Science and Technology)"
            affiliations = ["Senior Research Scientist, SB Intuitions", "Program-Specific Assistant Professor, Kyoto University", "Tokyo, Japan"]

    [languages.ja]
        label          = "日本語"
        locale         = "ja-JP"
        contentDir     = "content/ja"
        weight         = 1
        title          = "..."
        [languages.ja.params]
            dateFormat   = "2006年1月2日"
            description  = "..."
            footerText   = "2019-2026, by Ryuichiro Hataya, Powered by [Hugo](https://gohugo.io)"
            authorName   = "幡谷 龍一郎"
            tagline      = "Ryuichiro Hataya · 博士（情報理工学）"
            affiliations = ["SB Intuitions シニアリサーチサイエンティスト", "京都大学 特定助教", "東京"]
